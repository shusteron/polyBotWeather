polymarket:
  base_urls:
    gamma: "https://gamma-api.polymarket.com"
    clob: "https://clob.polymarket.com"

weather:
  open_meteo:
    ensemble_url: "https://ensemble-api.open-meteo.com/v1/ensemble"
    forecast_url: "https://api.open-meteo.com/v1/forecast"
  noaa:
    api_url: "https://api.weather.gov"
    aviation_weather_url: "https://aviationweather.gov/api/data"
  models:
    - "ecmwf_ifs025"    # 50 members — best global model
    - "gfs025"          # 30 members — NOAA operational
    - "icon_seamless"   # 39 members — DWD, excellent Europe
    - "gem_global"      # 20 members — Canadian
    - "bom_access_global_ensemble"  # 17 members — Australian BOM
  model_weights:
    nws_point: 0.40         # NWS MOS station-calibrated — matches Polymarket source
    ecmwf_ifs025: 0.24      # reduced from 0.40
    gfs025: 0.15            # reduced from 0.25
    icon_seamless: 0.12     # reduced from 0.20
    gem_global: 0.06        # reduced from 0.10
    bom_access_global_ensemble: 0.03  # reduced from 0.05
  request_timeout: 30
  min_ensemble_members: 50   # reject if total members below this

risk:
  max_trade_exposure: 0.02   # max 2% capital per trade
  max_daily_exposure: 0.10   # max 10% capital per day
  max_concurrent_positions: 5
  kelly_fraction: 0.25       # conservative fractional Kelly
  starting_capital: 10000.0
  min_kelly_bet: 10.0
  max_single_bet: 200.0      # hard cap per trade

thresholds:
  # ── Confidence ──────────────────────────────────────────────────────────
  min_confidence: 72

  # ── Forecast quality ────────────────────────────────────────────────────
  max_ensemble_spread: 0.15      # weighted_std / 10 → reject if std > 1.5°C
  min_threshold_distance: 1.5    # forecast must be >1.5°C away from threshold
  min_provider_agreement: 0.65
  min_stability_score: 0.55

  # ── Market quality ───────────────────────────────────────────────────────
  min_liquidity: 50              # minimum $ in the market
  max_spread_pct: 0.06           # max bid-ask spread
  min_hours_to_resolution: 6     # don't enter if resolving in < 6 hours

  # ── Price floor (no lottery tickets) ────────────────────────────────────
  # The side we are buying must be priced above this.
  # 0.02 = 2 cents minimum. Sub-2-cent bets require extreme model precision
  # that weather ensembles cannot provide.
  min_market_price: 0.02

  # ── Dynamic edge requirement ─────────────────────────────────────────────
  # When the model and the market AGREE on direction (both lean YES, or
  # both lean NO) but disagree on the exact probability, the gap must be
  # very large.  Weather ensemble models are NOT precise enough at the
  # tails to reliably distinguish 86% from 99.7%.
  #
  # When the model DISAGREES with the market direction (model says 39%,
  # market says 1.6%) that is a strong structural signal — lower bar.
  min_edge_same_direction: 0.25  # e.g. model=86%, market=99.7% → gap=13.7% < 25% → skip
  min_edge_contrarian: 0.15      # e.g. model=39%, market=1.6%  → gap=37.4% > 15% → trade

  # ── Zone reliability gate ────────────────────────────────────────────────
  # Once ≥20 resolved records exist in a probability band (0-10%, 10-20%…)
  # skip that band if the model's Brier-based score is below this.
  # Has no effect until enough calibration data is collected.
  min_zone_reliability: 40.0
  min_zone_samples: 20

execution:
  human_approval_mode: true
  paper_trading: true
  simulated_slippage: 0.002
  simulated_fee: 0.002

logging:
  level: "INFO"
  data_dir: "data/"
  log_file: "data/bot.log"
  events_file: "data/events.jsonl"
  rotation: "10 MB"
  retention: "30 days"
