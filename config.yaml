polymarket:
  base_urls:
    gamma: "https://gamma-api.polymarket.com"
    clob: "https://clob.polymarket.com"

weather:
  open_meteo:
    ensemble_url: "https://ensemble-api.open-meteo.com/v1/ensemble"
    forecast_url: "https://api.open-meteo.com/v1/forecast"
  noaa:
    api_url: "https://api.weather.gov"
    aviation_weather_url: "https://aviationweather.gov/api/data"
  models:
    - "ecmwf_ifs025"    # 50 members — best global model
    - "gfs025"          # 30 members — NOAA operational
    - "icon_seamless"   # 39 members — DWD, excellent Europe
    - "gem_global"      # 20 members — Canadian
    - "bom_access_global_ensemble"  # 17 members — Australian BOM
  model_weights:
    nws_point: 0.40         # NWS MOS station-calibrated — matches Polymarket source
    ecmwf_ifs025: 0.24
    gfs025: 0.15
    icon_seamless: 0.12
    gem_global: 0.06
    bom_access_global_ensemble: 0.03
  request_timeout: 30
  min_ensemble_members: 50   # reject if total members below this

risk:
  max_trade_exposure: 0.02   # max 2% capital per trade
  max_daily_exposure: 0.10   # max 10% capital per day
  max_concurrent_positions: 5
  kelly_fraction: 0.25       # conservative fractional Kelly
  starting_capital: 10000.0
  min_kelly_bet: 10.0
  max_single_bet: 75.0       # reduced from $200 — small bets during calibration phase

thresholds:
  # ── Confidence ──────────────────────────────────────────────────────────
  min_confidence: 52

  # ── Forecast quality ────────────────────────────────────────────────────
  max_ensemble_spread: 0.15      # weighted_std / 10 → reject if std > 1.5°C
  min_threshold_distance: 1.5    # forecast must be >1.5°C away from threshold
  min_provider_agreement: 0.60
  min_stability_score: 0.50

  # ── Market quality ───────────────────────────────────────────────────────
  min_liquidity: 50              # minimum $ in the market
  max_spread_pct: 0.06           # max bid-ask spread
  min_hours_to_resolution: 6     # don't enter if resolving in < 6 hours

  # ── Price floor (no lottery tickets) ────────────────────────────────────
  min_market_price: 0.02

  # ── Market consensus guard ───────────────────────────────────────────────
  # Never bet against a market that is ≥85% sure of one outcome.
  # Polymarket bettors at 93%+ are almost always right.
  # Blocks: BUY_NO when market YES > 85%, BUY_YES when market YES < 15%.
  max_market_consensus: 0.85

  # ── Edge requirements ─────────────────────────────────────────────────────
  # SAME DIRECTION (model and market agree on the likely outcome):
  #   We're adding precision to the market signal. 2% edge is sufficient —
  #   take small, frequent, high-probability edges rather than waiting for
  #   rare big ones.
  #   Example: market=95% YES, model=97% YES → edge=2% → TRADE ✓
  #
  # CONTRARIAN (model opposes market direction):
  #   Extraordinary claim — requires 35% minimum edge.
  #   Also capped at 40%: if model-market gap is >40% contrarian, the
  #   model is probably miscalibrated (the market is not that wrong).
  #   Example: market=29% YES, model=84% YES → edge=55% contrarian → BLOCKED ✓
  min_edge_same_direction: 0.02
  min_edge_contrarian: 0.35
  max_contrarian_edge: 0.40

  # ── Model probability floor ──────────────────────────────────────────────
  # Model must give ≥20% to the side being purchased.
  # Lowered from 0.35 — allows moderate-probability same-direction trades.
  min_purchased_side_prob: 0.20

  # ── Zone reliability gate ────────────────────────────────────────────────
  # Once ≥20 resolved records exist in a probability band, skip zones where
  # the model has consistently been wrong. No effect until enough data.
  min_zone_reliability: 40.0
  min_zone_samples: 20

execution:
  human_approval_mode: true
  paper_trading: true
  simulated_slippage: 0.002
  simulated_fee: 0.002

logging:
  level: "INFO"
  data_dir: "data/"
  log_file: "data/bot.log"
  events_file: "data/events.jsonl"
  rotation: "10 MB"
  retention: "30 days"
