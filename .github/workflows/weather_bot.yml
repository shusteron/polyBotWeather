name: Weather Bot — Auto Scan

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (scan)
    - cron: '0 19 * * *'  # 19:00 UTC daily (scan)
    - cron: '0 13 * * *'  # 13:00 UTC daily (resolve — 1h after markets close at 12:00 UTC)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - resolve

concurrency:
  group: weather-bot
  cancel-in-progress: false  # queue, never cancel a running job

jobs:
  scan:
    if: >
      github.event.schedule == '0 7 * * *' ||
      github.event.schedule == '0 19 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'resolve')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python main.py --mode scan

      - name: Export Excel report
        run: python main.py --mode report

      - name: Commit results
        run: |
          git config user.name "WeatherBot"
          git config user.email "bot@weatherbot.local"
          git add data/ exports/
          git diff --cached --quiet || git commit -m "auto: scan $(date '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve:
    if: >
      github.event.schedule == '0 13 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'resolve')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve expired markets
        run: python main.py --mode resolve

      - name: Export Excel report
        run: python main.py --mode report

      - name: Commit results
        run: |
          git config user.name "WeatherBot"
          git config user.email "bot@weatherbot.local"
          git add data/ exports/
          git diff --cached --quiet || git commit -m "auto: resolve $(date '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
